#
# Builds the main site (docs/, Zensical) and publishes it with mike to the
# gh-pages branch: https://jkk-research.github.io/<version>/, with the site
# root redirecting to /latest/.
#
# The wiki in wiki/ is published separately by deploy-wiki.yml.
#
name: Deploy Site

on:
  push:
    paths:
    - 'docs/**'
    - 'zensical.toml'
    - 'bibliography.py'
    - 'requirements.txt'
    - '.github/workflows/deploy.yml'
    - 'refs.bib'
    branches:
    - master
  workflow_dispatch:
    #
    # If your repository would have releases should you uncomment the below lines
    # in order to ignore pushes caused by newly created releases.
    #
    #tags-ignore:
    #- '**'

# Shared with deploy-wiki.yml so the two never push to gh-pages at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_VERSION: 2026-autumn  # keep in sync with deploy-wiki.yml
      DOCS_ALIAS: latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install -r requirements.txt
    - name: Check build
      run: zensical build --clean --strict
    - name: Fetch GH pages
      run: git fetch origin gh-pages --depth=1
    - name: Deploy Files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "actions@github.com"
        mike deploy --push --update-aliases "$DOCS_VERSION" "$DOCS_ALIAS"
        mike set-default --push "$DOCS_ALIAS"
