[project.theme]
# Zensical's own design, with the JKK colours from stylesheets/extra.css.
# ("classic" would match the Material for MkDocs look of the main site.)
variant = "modern"
logo = "img/jkk03.svg"
favicon = "img/favicon.ico"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "search.highlight",
  "navigation.tabs",
  "navigation.top",
  "toc.follow",
]

[project.theme.icon]
logo = "material/library"
repo = "material/library"

# "youtube" is the custom light scheme defined in stylesheets/extra.css.
[[project.theme.palette]]
scheme = "youtube"
primary = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jkk-research/jkk-research.github.io"

# Version selector, fed by /wiki/versions.json that mike maintains.
[project.extra.version]
provider = "mike"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
codehilite.guess_lang = false
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
