# JKK Wiki, built with Zensical (https://zensical.org) and published with mike
# to https://jkk-research.github.io/wiki/<version>/, where /wiki/ redirects to
# /wiki/latest/ (see .github/workflows/deploy-wiki.yml).
#
# The rest of the site is still built with MkDocs from ../mkdocs.yml. The nav
# tabs, palette and colours below mirror that file; keep them in sync.
#
#   pip install -r requirements.txt
#   zensical serve     # preview on http://localhost:8000
#   zensical build     # output in site/

[project]
site_name = "JKK Research Center"
site_description = "Research Center of Vehicle Industry"
site_author = "jkk-research"
site_url = "https://jkk-research.github.io/wiki/latest/"
copyright = "&copy; SZE-JKK"
repo_url = "https://github.com/jkk-research/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

